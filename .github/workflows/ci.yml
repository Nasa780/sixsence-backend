# Vérification automatique de chaque PR et de chaque commit sur main :
# le backend doit s'installer et compiler sans erreur TypeScript.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation (compile aussi via postinstall)
        run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
